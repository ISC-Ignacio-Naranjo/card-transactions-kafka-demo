server:
  port: 8080

spring:
  application:
    name: transactions-service

  datasource:
    url: jdbc:postgresql://localhost:5433/transactions
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  topics:
    transaction-created: transaction.created.v2
