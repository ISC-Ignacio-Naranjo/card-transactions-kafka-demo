name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build transactions-service (skip tests)
        working-directory: ./transactions-service
        run: mvn -B -DskipTests clean package

      - name: Build fraud-service (skip tests)
        working-directory: ./fraud-service
        run: mvn -B -DskipTests clean package


